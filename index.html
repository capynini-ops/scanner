<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f3d2e">
<title>Scan nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f6f7f4,#0e1311);--card:light-dark(#fff,#18201d);--ink:light-dark(#14201b,#e8eeea);
  --mute:light-dark(#5b6b64,#9aaba3);--line:light-dark(#e2e7e3,#2a3530);--brand:#0f3d2e;--accent:#18a058;
  --A:#038141;--B:#85bb2f;--C:#e6b800;--D:#ee8100;--E:#e63e11}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
header{background:var(--brand);color:#fff;padding:14px max(4vw,16px)}
header h1{margin:0;font-size:20px;font-weight:800}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:640px;margin:0 auto;padding:16px max(4vw,16px) 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:30% 12%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .laser{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff3b30;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.cam .laser{animation:none}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.btn{font:600 16px Figtree,system-ui,sans-serif;min-height:48px;padding:0 18px;border-radius:12px;border:0;cursor:pointer;
  background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,.btn:focus-within{outline:3px solid #6cc4ff;outline-offset:2px}
.big{flex:1 1 100%}
input[type=text]{flex:1 1 180px;font:16px Figtree,system-ui,sans-serif;min-height:48px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:14px;color:var(--mute);margin:10px 0 0;min-height:1.5em}
.status.err{color:var(--E)}
.prod{display:flex;gap:14px;align-items:center}
.prod img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);flex:none}
.prod h2{margin:0;font-size:20px;line-height:1.2}
.prod p{margin:2px 0 0;color:var(--mute);font-size:14px}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.score{border-radius:14px;padding:14px;color:#fff;position:relative;display:block;width:100%;min-height:0;text-align:left;
  font-weight:400;border:3px solid transparent;opacity:.55;transition:opacity .2s}
.score[aria-selected=true]{opacity:1;border-color:var(--ink)}
.score .hint{font-size:12px;margin-top:6px;opacity:.9}
.exp{margin-top:16px}
.exp .sum{font-size:17px;font-weight:600;margin:0 0 4px;line-height:1.4}
.exp h5{margin:18px 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.exp h5::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}
.exp h5.pro::before{background:var(--A)}.exp h5.con::before{background:var(--E)}.exp h5.tip::before{background:#2f7fd8}
.exp ul.pts{margin:0;padding:0 0 0 20px}
.exp ul.pts li{margin:0 0 10px;font-size:15.5px;line-height:1.5}
.exp ul.pts li strong{font-weight:600}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center}
details p{font-size:15px;margin:6px 0 10px}
.score h3{margin:0;font-size:14px;font-weight:600;opacity:.95}
.score .val{font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1.05;margin-top:4px}
.score .val small{font-size:16px;font-weight:600;opacity:.85}
.score .grade{position:absolute;top:12px;right:14px;font-size:26px;font-weight:800;background:rgba(255,255,255,.22);
  width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.score .lbl{font-size:14px;margin-top:2px}
.g-A{background:var(--A)}.g-B{background:var(--B)}.g-C{background:var(--C);color:#2a2100}.g-D{background:var(--D)}.g-E{background:var(--E)}.g-NA{background:#7a8580}
h4{margin:18px 0 8px;font-size:15px}
ul.why{list-style:none;margin:0;padding:0}
ul.why li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.why li b{white-space:nowrap;font-weight:600}
.neg{color:var(--E)}.pos{color:var(--A)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.hist{list-style:none;margin:0;padding:0}
.hist li button{width:100%;justify-content:space-between;background:transparent;color:var(--ink);border-bottom:1px solid var(--line);
  border-radius:0;padding:0 4px;font-weight:400;text-align:left}
.hist .dots{display:flex;gap:4px;flex:none}
.hist .dot{width:24px;height:24px;border-radius:6px;color:#fff;font:800 13px Figtree,sans-serif;display:grid;place-items:center}
.hist span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Scan nutrition</h1>
  <p>Score diabète et score régime à partir du code-barres</p>
</header>
<main>
  <section class="card" aria-label="Scanner">
    <div class="cam" id="cam"><video id="video" playsinline muted></video><div class="frame"></div><div class="laser"></div></div>
    <div class="row">
      <button class="big" id="scanBtn" type="button">Scanner un produit</button>
    </div>
    <form class="row" id="manual">
      <input type="text" id="code" inputmode="numeric" autocomplete="off" placeholder="Ou saisir le code (ex. 3017620422003)" aria-label="Code-barres">
      <button type="submit" class="sec">Chercher</button>
      <label class="btn sec file">Photo du code<input type="file" id="photo" accept="image/*" capture="environment"></label>
    </form>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="card hidden" id="result" aria-live="polite"></section>

  <section class="card hidden" id="histCard">
    <h4 style="margin-top:0">Derniers produits scannés</h4>
    <ul class="hist" id="hist"></ul>
  </section>

  <p class="note">Données : Open Food Facts (base collaborative, peut contenir des erreurs). Les scores sont des repères calculés sur 100 g ou 100 ml ; ils ne remplacent pas l'avis d'un médecin ou d'un diététicien.</p>
</main>

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
// 0 quand v <= good, 1 quand v >= bad, linéaire entre les deux
const ramp = (v, good, bad) => clamp((v - good) / (bad - good), 0, 1);
const grade = s => s == null ? 'NA' : s >= 80 ? 'A' : s >= 60 ? 'B' : s >= 40 ? 'C' : s >= 20 ? 'D' : 'E';
const LABEL = {A:'Très adapté', B:'Adapté', C:'Avec modération', D:'Peu adapté', E:'À éviter', NA:'Données insuffisantes'};
const fmt = (v, u) => v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('fr-FR') + ' ' + u;

function readNutri(p) {
  const n = p.nutriments || {};
  const num = k => { const v = n[k]; return v === undefined || v === '' || isNaN(+v) ? null : +v; };
  let kcal = num('energy-kcal_100g');
  if (kcal == null && num('energy_100g') != null) kcal = num('energy_100g') / 4.184;
  const cats = p.categories_tags || [];
  const drink = cats.includes('en:beverages') && !cats.includes('en:plant-based-foods-and-beverages') || cats.includes('en:sodas');
  return {
    kcal, carbs: num('carbohydrates_100g'), sugars: num('sugars_100g'), fiber: num('fiber_100g') ?? 0,
    protein: num('proteins_100g') ?? 0, fat: num('fat_100g'), sat: num('saturated-fat_100g') ?? 0,
    salt: num('salt_100g'), nova: p.nova_group ? +p.nova_group : null, drink,
    serving: p.serving_quantity ? +p.serving_quantity : null,
    sweet: (p.additives_tags || []).some(t => /^en:e(95[0-2]|954|955|96[0-2]|969)/.test(t))
  };
}

// Score diabète : sucres, glucides nets, fibres, graisses saturées, ultra-transformation
function diabetesScore(d) {
  if (d.carbs == null && d.sugars == null) return null;
  const sugars = d.sugars ?? 0, net = Math.max(0, (d.carbs ?? sugars) - d.fiber);
  const f = [];
  f.push(['Sucres', -30 * (d.drink ? ramp(sugars, 0.5, 8) : ramp(sugars, 5, 22.5)), fmt(sugars, 'g')]);
  f.push(['Glucides nets (glucides − fibres)', -45 * (d.drink ? ramp(net, 1, 10) : ramp(net, 5, 45)), fmt(net, 'g')]);
  f.push(['Graisses saturées', -10 * ramp(d.sat, 1, 5), fmt(d.sat, 'g')]);
  if (d.nova) f.push(['Ultra-transformation (NOVA ' + d.nova + ')', d.nova === 4 ? -10 : d.nova === 3 ? -4 : 0, '']);
  f.push(['Fibres', 10 * ramp(d.fiber, 0, 6), fmt(d.fiber, 'g')]);
  f.push(['Protéines', 5 * ramp(d.protein, 3, 15), fmt(d.protein, 'g')]);
  return finish(f);
}

// Score régime (perte de poids) : densité énergétique, sucres, gras saturés, satiété (protéines, fibres)
function dietScore(d) {
  if (d.kcal == null) return null;
  const f = [];
  f.push(['Densité calorique', -50 * (d.drink ? ramp(d.kcal, 2, 40) : ramp(d.kcal, 80, 400)), fmt(d.kcal, 'kcal')]);
  f.push(['Sucres', -(d.drink ? 25 : 15) * (d.drink ? ramp(d.sugars ?? 0, 0.5, 8) : ramp(d.sugars ?? 0, 5, 22.5)), fmt(d.sugars, 'g')]);
  f.push(['Graisses saturées', -15 * ramp(d.sat, 1, 6), fmt(d.sat, 'g')]);
  if (d.nova) f.push(['Ultra-transformation (NOVA ' + d.nova + ')', d.nova === 4 ? -10 : d.nova === 3 ? -4 : 0, '']);
  f.push(['Protéines (satiété)', 10 * ramp(d.protein, 5, 20), fmt(d.protein, 'g')]);
  f.push(['Fibres (satiété)', 6 * ramp(d.fiber, 3, 8), fmt(d.fiber, 'g')]);
  return finish(f);
}

function finish(f) {
  const factors = f.map(([name, pts, val]) => ({name, pts: Math.round(pts), val})).filter(x => x.pts !== 0)
    .sort((a, b) => Math.abs(b.pts) - Math.abs(a.pts));
  const raw = 100 + f.reduce((s, x) => s + x[1], 0);
  return {score: Math.round(clamp(raw, 0, 100)), factors};
}

// ---------- Explications en langage courant ----------
const n1 = v => (Math.round(v * 10) / 10).toLocaleString('fr-FR');
const n0 = v => Math.round(v).toLocaleString('fr-FR');
// Un morceau de sucre pèse environ 5 g
const cubes = g => { const c = g / 5; return c < 0.75 ? 'moins d’un morceau de sucre' : c < 1.5 ? 'environ 1 morceau de sucre' : `environ ${n0(c)} morceaux de sucre`; };
const unitOf = d => d.drink ? '100 ml' : '100 g';

function explainDiabetes(d, g) {
  if (d.carbs == null && d.sugars == null) return null;
  const u = unitOf(d), pros = [], cons = [], tips = [];
  const sug = d.sugars ?? 0, net = Math.max(0, (d.carbs ?? sug) - d.fiber);
  const hiSug = d.drink ? sug > 5 : sug > 22.5, midSug = d.drink ? sug > 0.5 : sug > 5;
  const hiNet = d.drink ? net > 8 : net > 40, midNet = d.drink ? net > 2 : net > 15;

  if (hiSug) cons.push(`<strong>Très sucré.</strong> ${n1(sug)} g de sucres pour ${u}, soit ${cubes(sug)}. ` + (d.drink
    ? 'Dans une boisson, le sucre est déjà dissous : il n’y a rien à digérer, il passe dans le sang en quelques minutes et provoque un pic de glycémie rapide.'
    : 'Ces sucres simples sont absorbés rapidement et font monter la glycémie vite et fort.'));
  else if (midSug) cons.push(`<strong>Sucre en quantité modérée.</strong> ${n1(sug)} g de sucres pour ${u}, soit ${cubes(sug)}. Ce n’est pas excessif, mais cela s’ajoute au reste de la journée.`);
  else pros.push(`<strong>Peu ou pas sucré.</strong> ${n1(sug)} g de sucres pour ${u}.`);

  if (hiNet && hiSug && sug > net / 2) { /* déjà couvert par la ligne sur les sucres */ }
  else if (hiNet) cons.push(sug > net / 2
    ? `<strong>Beaucoup de glucides.</strong> ${n1(net)} g de glucides « nets » (glucides moins fibres) pour ${u}, en grande partie sous forme de sucres.`
    : `<strong>Beaucoup de glucides, même s’il n’a pas un goût sucré.</strong> ${n1(net)} g de glucides « nets » (glucides moins fibres) pour ${u}. L’amidon, présent dans le pain, les pâtes, le riz, les biscuits ou les chips, est découpé en glucose pendant la digestion. Ce sont les glucides au total, et pas seulement les sucres, qui font monter la glycémie.`);
  else if (midNet) cons.push(`<strong>Glucides en quantité moyenne.</strong> ${n1(net)} g de glucides nets pour ${u}. L’effet sur la glycémie dépend surtout de la quantité que vous en mangez.`);
  else pros.push(`<strong>Pauvre en glucides.</strong> ${n1(net)} g de glucides nets pour ${u} : l’effet sur la glycémie est faible.`);

  if (d.fiber >= 6) pros.push(`<strong>Riche en fibres.</strong> ${n1(d.fiber)} g pour ${u}. Les fibres ralentissent la digestion et le passage du glucose dans le sang : la glycémie monte plus lentement et moins haut.`);
  else if (d.fiber >= 3) pros.push(`<strong>Source de fibres.</strong> ${n1(d.fiber)} g pour ${u}. Elles freinent un peu l’absorption des glucides.`);
  else if (net > 15) cons.push(`<strong>Presque pas de fibres.</strong> ${n1(d.fiber)} g pour ${u}. Rien ne freine l’absorption des glucides, qui passent vite dans le sang.`);

  if (d.protein >= 10) pros.push(`<strong>Bonne teneur en protéines.</strong> ${n1(d.protein)} g pour ${u}. Les protéines ralentissent la vidange de l’estomac, ce qui atténue la montée de la glycémie après le repas.`);

  if (d.sat > 5) cons.push(`<strong>Riche en graisses saturées.</strong> ${n1(d.sat)} g pour ${u}. Elles n’agissent pas directement sur la glycémie. En revanche, le diabète augmente déjà le risque de maladies cardiovasculaires, et les graisses saturées l’augmentent aussi.`);

  if (d.nova === 4) cons.push('<strong>Produit ultra-transformé (NOVA 4).</strong> Sa recette contient des ingrédients qu’on n’utilise pas en cuisine, comme des arômes, des additifs, des sirops ou des amidons modifiés. Les grandes études de population associent une consommation élevée de ces produits à un risque plus élevé de diabète de type 2.');
  else if (d.nova === 1) pros.push('<strong>Aliment brut ou très peu transformé (NOVA 1).</strong>');

  if (d.sweet) tips.push('Ce produit contient des édulcorants. Ils n’apportent pas de sucre et ne font pas monter la glycémie de façon notable.');
  if (d.serving && d.carbs != null) tips.push(`Une portion de ${n0(d.serving)} ${d.drink ? 'ml' : 'g'} apporte ${n1(net * d.serving / 100)} g de glucides nets` +
    (sug >= 1 ? `, dont ${n1(sug * d.serving / 100)} g de sucres (${cubes(sug * d.serving / 100)})` : '') + '. C’est ce chiffre qu’il faut retenir si vous comptez vos glucides.');
  if (d.drink && hiSug) tips.push('Pour vous désaltérer, préférez l’eau, l’eau gazeuse ou une version sans sucre. Une boisson sucrée peut en revanche servir à corriger une hypoglycémie, si votre médecin vous l’a indiqué.');
  else if (hiSug) tips.push('Si vous en mangez, prenez-le plutôt en fin de repas qu’en encas isolé. Les fibres, protéines et matières grasses du repas ralentissent l’absorption du sucre. Gardez une petite portion.');
  else if (hiNet || (midNet && d.fiber < 3)) tips.push('Accompagnez-le de légumes et d’une source de protéines (poisson, viande, légumineuses, laitage) : le repas sera digéré plus lentement. Quand elle existe, une version complète ou aux céréales complètes est préférable.');
  if (!cons.length) tips.push('Ce produit peut faire partie de vos repas sans précaution particulière pour la glycémie.');

  const SUM = {A: 'Bon choix pour la glycémie.', B: 'Plutôt adapté, en faisant attention à la quantité.',
    C: 'À consommer avec modération, en surveillant la portion.', D: 'Peu adapté : il fait monter la glycémie de façon notable.',
    E: 'À éviter, sauf occasionnellement : il fait monter la glycémie fortement.'};
  return {sum: SUM[g], pros, cons, tips};
}

function explainDiet(d, g) {
  if (d.kcal == null) return null;
  const u = unitOf(d), pros = [], cons = [], tips = [];
  const sug = d.sugars ?? 0, pct = `soit ${n0(d.kcal / 20)} % des apports d’une journée type à 2 000 kcal`;
  const hiSug = d.drink ? sug > 5 : sug > 22.5;

  if (d.drink) {
    if (d.kcal > 20) cons.push(`<strong>Des calories qui ne rassasient pas.</strong> ${n0(d.kcal)} kcal pour 100 ml, soit ${n0(d.kcal * 2.5)} kcal pour un verre de 25 cl. Les calories bues ne calment pas la faim : on ne mange pas moins au repas suivant pour compenser.`);
    else pros.push(`<strong>Très peu calorique.</strong> ${n1(d.kcal)} kcal pour 100 ml.`);
  } else if (d.kcal < 100) pros.push(`<strong>Peu calorique.</strong> ${n0(d.kcal)} kcal pour 100 g. On peut en manger une portion qui remplit l’estomac pour peu de calories.`);
  else if (d.kcal < 250) pros.push(`<strong>Calories modérées.</strong> ${n0(d.kcal)} kcal pour 100 g, ${pct}.`);
  else if (d.kcal < 400) cons.push(`<strong>Assez calorique.</strong> ${n0(d.kcal)} kcal pour 100 g, ${pct}. La taille de la portion fait toute la différence.`);
  else cons.push(`<strong>Très calorique.</strong> ${n0(d.kcal)} kcal pour 100 g, ${pct}. Une petite quantité apporte beaucoup d’énergie sans beaucoup remplir l’estomac.`);

  if (d.fat != null && d.fat > 15 && d.kcal > 0) {
    const share = Math.min(100, d.fat * 9 / d.kcal * 100);
    if (share >= 50) cons.push(`<strong>Les matières grasses fournissent l’essentiel des calories.</strong> ${n1(d.fat)} g pour ${u}, soit environ ${n0(share)} % des calories du produit. Un gramme de gras apporte 9 kcal, contre 4 kcal pour un gramme de glucides ou de protéines.`);
  }
  if (hiSug) cons.push(`<strong>Beaucoup de sucre.</strong> ${n1(sug)} g pour ${u}, soit ${cubes(sug)}. Le sucre apporte des calories sans rassasier, et la faim revient vite après le pic de glycémie.`);
  if (d.sat > 6) cons.push(`<strong>Riche en graisses saturées.</strong> ${n1(d.sat)} g pour ${u}. À limiter pour la santé du cœur, indépendamment du poids.`);
  if (d.protein >= 10) pros.push(`<strong>Riche en protéines.</strong> ${n1(d.protein)} g pour ${u}. Les protéines sont les nutriments qui rassasient le plus, et elles aident à préserver les muscles quand on mange moins.`);
  if (d.fiber >= 3) pros.push(`<strong>Contient des fibres.</strong> ${n1(d.fiber)} g pour ${u}. Elles prennent de la place dans l’estomac et prolongent la sensation de satiété.`);
  if (d.nova === 4) cons.push('<strong>Produit ultra-transformé (NOVA 4).</strong> Ces produits se mangent vite et facilement. Dans une étude contrôlée des National Institutes of Health américains (2019), les participants mangeaient spontanément environ 500 kcal de plus par jour avec une alimentation ultra-transformée qu’avec une alimentation peu transformée.');
  else if (d.nova === 1) pros.push('<strong>Aliment brut ou très peu transformé (NOVA 1).</strong>');

  if (d.serving) tips.push(`Une portion de ${n0(d.serving)} ${d.drink ? 'ml' : 'g'} apporte ${n0(d.kcal * d.serving / 100)} kcal.`);
  if (d.drink && d.kcal > 20) tips.push('Remplacez-la par de l’eau, de l’eau gazeuse, une infusion ou une version sans sucre.');
  if (!d.drink && d.kcal >= 400) tips.push(`Servez-vous une portion mesurée plutôt que de manger directement dans le paquet.${d.serving ? '' : ` À titre de repère, 30 g apportent ${n0(d.kcal * 0.3)} kcal.`}`);
  if (!d.drink && d.kcal >= 250 && d.protein < 5 && d.fiber < 3) tips.push('Ce produit rassasie peu. Si vous en mangez, accompagnez-le de légumes ou d’une source de protéines pour tenir jusqu’au repas suivant.');
  if (d.kcal < 150 && d.protein >= 10) tips.push('Bon allié pour un repas ou un encas rassasiant à peu de calories.');
  if (d.sweet) tips.push('Ce produit contient des édulcorants. Ils n’apportent pas de calories, mais l’OMS recommande depuis 2023 de ne pas compter sur eux pour perdre du poids sur la durée.');
  if (!cons.length) tips.push('Peut être consommé régulièrement dans le cadre d’un régime.');

  const SUM = {A: 'Bon choix pour un régime.', B: 'Plutôt adapté, en gardant un œil sur la portion.',
    C: 'Possible de temps en temps, en portion mesurée.', D: 'Peu adapté à un régime : beaucoup de calories pour peu de satiété.',
    E: 'À éviter pendant un régime.'};
  return {sum: SUM[g], pros, cons, tips};
}

function scoreCard(id, title, r, selected) {
  const g = grade(r?.score);
  return `<button type="button" role="tab" id="tab-${id}" aria-controls="panel-${id}" aria-selected="${selected}" class="score g-${g}">
    <h3>${title}</h3><div class="val">${r ? r.score : '—'}<small>/100</small></div>
    <div class="lbl">${LABEL[g]}</div><div class="grade">${g === 'NA' ? '?' : g}</div>
    <div class="hint">${selected ? 'Explications ci-dessous' : 'Toucher pour voir le détail'}</div></button>`;
}
const li = a => a.map(x => `<li>${x}</li>`).join('');
function panel(id, r, e, selected, u) {
  const body = !e ? '<p class="note">Les valeurs nutritionnelles nécessaires manquent sur Open Food Facts : impossible de calculer ce score.</p>' : `
    <p class="sum">${e.sum}</p>
    ${e.pros.length ? `<h5 class="pro">Points forts</h5><ul class="pts">${li(e.pros)}</ul>` : ''}
    ${e.cons.length ? `<h5 class="con">Points faibles</h5><ul class="pts">${li(e.cons)}</ul>` : ''}
    ${e.tips.length ? `<h5 class="tip">Conseils</h5><ul class="pts">${li(e.tips)}</ul>` : ''}
    <details><summary>Détail du calcul (${r.score}/100)</summary>
      <p>Le score part de 100. Chaque critère retire ou ajoute des points selon les valeurs pour ${u}.</p>${whyList(r)}</details>`;
  return `<section class="exp" role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}"${selected ? '' : ' hidden'}>${body}</section>`;
}
function whyList(r) {
  if (!r) return '<p class="note">Valeurs nutritionnelles manquantes sur Open Food Facts.</p>';
  if (!r.factors.length) return '<p class="note">Aucun point pénalisant.</p>';
  return '<ul class="why">' + r.factors.map(x => `<li><span>${esc(x.name)}${x.val ? ' · ' + esc(x.val) : ''}</span>
    <b class="${x.pts < 0 ? 'neg' : 'pos'}">${x.pts > 0 ? '+' : ''}${x.pts}</b></li>`).join('') + '</ul>';
}

function render(p, code) {
  const d = readNutri(p), dia = diabetesScore(d), reg = dietScore(d);
  const eDia = explainDiabetes(d, grade(dia?.score)), eReg = explainDiet(d, grade(reg?.score));
  const name = p.product_name_fr || p.product_name || 'Produit sans nom';
  const unit = d.drink ? '100 ml' : '100 g';
  const portion = d.serving && d.carbs != null
    ? `<tr><td>Glucides par portion (${fmt(d.serving, d.drink ? 'ml' : 'g')})</td><td>${fmt(d.carbs * d.serving / 100, 'g')}</td></tr>` : '';
  const tags = [];
  if (p.nutriscore_grade && /^[a-e]$/.test(p.nutriscore_grade)) tags.push('Nutri-Score ' + p.nutriscore_grade.toUpperCase());
  if (d.nova) tags.push('NOVA ' + d.nova);
  if (p.quantity) tags.push(p.quantity);
  tags.push('EAN ' + code);
  const img = p.image_front_small_url || p.image_small_url;
  $('#result').innerHTML = `
    <div class="prod">${img ? `<img src="${esc(img)}" alt="">` : ''}
      <div><h2>${esc(name)}</h2><p>${esc(p.brands || '')}</p></div></div>
    <div class="scores" role="tablist" aria-label="Scores">${scoreCard('dia', 'Diabète', dia, true)}${scoreCard('reg', 'Régime', reg, false)}</div>
    ${panel('dia', dia, eDia, true, unit)}${panel('reg', reg, eReg, false, unit)}
    <details><summary>Comment lire ces scores</summary>
      <p><strong>Glycémie</strong> : le taux de sucre dans le sang. Après un repas, les glucides sont transformés en glucose et la glycémie monte. Plus elle monte vite et haut, plus c’est difficile à gérer avec un diabète.</p>
      <p><strong>Glucides nets</strong> : les glucides totaux moins les fibres. Les fibres ne sont pas absorbées comme du sucre, c’est pourquoi on les retire.</p>
      <p><strong>Densité calorique</strong> : le nombre de calories pour 100 g. Les aliments peu denses (légumes, fruits, laitages nature, viandes maigres) permettent de manger à sa faim avec moins de calories.</p>
      <p><strong>NOVA</strong> : le degré de transformation, de 1 (brut) à 4 (ultra-transformé).</p>
      <p>Les scores vont de 0 à 100 : A à partir de 80, B à partir de 60, C à partir de 40, D à partir de 20, E en dessous. Ils jugent le produit pour 100 g ou 100 ml ; la quantité que vous mangez compte autant que le score.</p>
    </details>
    <h4>Valeurs pour ${unit}</h4>
    <table>
      <tr><td>Énergie</td><td>${fmt(d.kcal, 'kcal')}</td></tr>
      <tr><td>Glucides</td><td>${fmt(d.carbs, 'g')}</td></tr>
      <tr><td>dont sucres</td><td>${fmt(d.sugars, 'g')}</td></tr>
      <tr><td>Fibres</td><td>${fmt(d.fiber, 'g')}</td></tr>
      <tr><td>Protéines</td><td>${fmt(d.protein, 'g')}</td></tr>
      <tr><td>Matières grasses</td><td>${fmt(d.fat, 'g')}</td></tr>
      <tr><td>dont saturées</td><td>${fmt(d.sat, 'g')}</td></tr>
      <tr><td>Sel</td><td>${fmt(d.salt, 'g')}</td></tr>${portion}
    </table>
    <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <p class="note"><a href="https://fr.openfoodfacts.org/produit/${encodeURIComponent(code)}" target="_blank" rel="noopener">Voir ou corriger la fiche sur Open Food Facts</a></p>`;
  $('#result').classList.remove('hidden');
  $('#result').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
  saveHist({code, name, dia: grade(dia?.score), reg: grade(reg?.score)});
}

const FIELDS = 'product_name,product_name_fr,brands,quantity,serving_quantity,image_front_small_url,image_small_url,nutriments,nova_group,nutriscore_grade,categories_tags,additives_tags';
async function lookup(code) {
  code = String(code).replace(/\D/g, '');
  if (code.length < 8) return setStatus('Code-barres invalide.', true);
  setStatus('Recherche du produit ' + code + '…');
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?lc=fr&fields=${FIELDS}`);
    const j = await res.json();
    if (j.status !== 1 || !j.product) return setStatus('Produit introuvable dans Open Food Facts (' + code + ').', true);
    setStatus('');
    render(j.product, code);
  } catch (e) { setStatus('Impossible de joindre Open Food Facts. Vérifiez la connexion.', true); }
}
function setStatus(t, err) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!err); }

// --- Historique (localStorage)
const HK = 'scan-nutrition-hist';
function loadHist() { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch { return []; } }
function saveHist(item) {
  const h = [item, ...loadHist().filter(x => x.code !== item.code)].slice(0, 15);
  try { localStorage.setItem(HK, JSON.stringify(h)); } catch {}
  drawHist();
}
function drawHist() {
  const h = loadHist();
  $('#histCard').classList.toggle('hidden', !h.length);
  $('#hist').innerHTML = h.map(x => `<li><button type="button" data-code="${esc(x.code)}"><span class="n">${esc(x.name)}</span>
    <span class="dots"><span class="dot g-${esc(x.dia)}" title="Diabète">${x.dia === 'NA' ? '?' : esc(x.dia)}</span>
    <span class="dot g-${esc(x.reg)}" title="Régime">${x.reg === 'NA' ? '?' : esc(x.reg)}</span></span></button></li>`).join('');
}
$('#result').addEventListener('click', e => {
  const t = e.target.closest('[role=tab]'); if (!t) return;
  for (const b of document.querySelectorAll('#result [role=tab]')) {
    const on = b === t; b.setAttribute('aria-selected', on);
    b.querySelector('.hint').textContent = on ? 'Explications ci-dessous' : 'Toucher pour voir le détail';
    document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
  }
});
$('#hist').addEventListener('click', e => { const b = e.target.closest('button[data-code]'); if (b) lookup(b.dataset.code); });

// --- Scanner caméra : BarcodeDetector natif (Android/Chrome) sinon ZXing (iOS/Safari, Firefox)
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
let stream = null, zxReader = null, scanning = false;
const video = $('#video');

async function nativeDetector() {
  if (!('BarcodeDetector' in window)) return null;
  try {
    const ok = await BarcodeDetector.getSupportedFormats();
    const f = FORMATS.filter(x => ok.includes(x));
    return f.length ? new BarcodeDetector({formats: f}) : null;
  } catch { return null; }
}
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = ok; s.onerror = () => ko(new Error('zxing'));
    document.head.appendChild(s);
  });
}

async function startScan() {
  if (scanning) return stopScan();
  if (!navigator.mediaDevices?.getUserMedia) return setStatus('Caméra indisponible : la page doit être ouverte en HTTPS. Utilisez la saisie ou la photo.', true);
  scanning = true; $('#scanBtn').textContent = 'Arrêter'; $('#cam').classList.add('on');
  setStatus('Placez le code-barres dans le cadre.');
  const constraints = {video: {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}}};
  try {
    const det = await nativeDetector();
    if (det) {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream; await video.play();
      const tick = async () => {
        if (!scanning) return;
        try { const r = await det.detect(video); if (r.length) return found(r[0].rawValue); } catch {}
        setTimeout(tick, 150);
      };
      tick();
    } else {
      await loadZXing();
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      zxReader = new ZXing.BrowserMultiFormatReader(hints);
      await zxReader.decodeFromConstraints(constraints, video, r => { if (r && scanning) found(r.getText()); });
    }
  } catch (e) {
    stopScan();
    setStatus(e && e.name === 'NotAllowedError' ? 'Accès à la caméra refusé. Autorisez-le dans les réglages du navigateur.' : 'Impossible de démarrer la caméra.', true);
  }
}
function stopScan() {
  scanning = false; $('#scanBtn').textContent = 'Scanner un produit'; $('#cam').classList.remove('on');
  if (zxReader) { try { zxReader.reset(); } catch {} zxReader = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}
function found(code) {
  stopScan();
  if (navigator.vibrate) navigator.vibrate(80);
  $('#code').value = code;
  lookup(code);
}

// --- Décodage depuis une photo
async function decodePhoto(file) {
  setStatus('Lecture de la photo…');
  const url = URL.createObjectURL(file);
  try {
    const det = await nativeDetector();
    if (det) {
      const bmp = await createImageBitmap(file);
      const r = await det.detect(bmp);
      if (r.length) return found(r[0].rawValue);
    }
    await loadZXing();
    const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);
    found(r.getText());
  } catch { setStatus('Aucun code-barres lisible sur la photo. Essayez plus près, bien éclairé.', true); }
  finally { URL.revokeObjectURL(url); }
}

$('#scanBtn').addEventListener('click', startScan);
$('#manual').addEventListener('submit', e => { e.preventDefault(); lookup($('#code').value); });
$('#photo').addEventListener('change', e => { const f = e.target.files[0]; if (f) decodePhoto(f); e.target.value = ''; });
drawHist();
// Permet les liens directs : index.html#3017620422003
if (/^#\d{8,14}$/.test(location.hash)) lookup(location.hash.slice(1));
window.__scores = {diabetesScore, dietScore, readNutri};
}
</script>
